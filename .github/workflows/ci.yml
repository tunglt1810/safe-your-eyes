name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &code
      - "crates/**"
      - "assets/**"
      - "packaging/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *code
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GTK 4 and Xvfb dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev pkg-config xvfb x11-utils x11-xserver-utils xdotool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p sye-cli -p sye-platform -p sye-ui --all-targets --features msstore -- -D warnings

      - name: Run unit and headless UI tests
        run: |
          cargo test --workspace --no-fail-fast
          cargo test -p sye-cli -p sye-platform -p sye-ui --features msstore --no-fail-fast

      - name: Run opaque-box E2E suite (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --bin safe-your-eyes
          python3 e2e/run_e2e.py --bin target/debug/safe-your-eyes --tier all
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 e2e/gui_smoke.py --bin target/debug/safe-your-eyes

      - name: Build release binary
        run: cargo build --release --bin safe-your-eyes

      - name: Run real-OS GUI window smoke E2E (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python e2e/gui_smoke.py --bin target/release/safe-your-eyes.exe
          else
            python3 e2e/gui_smoke.py --bin target/release/safe-your-eyes
          fi

      - name: Calculate release SHA-256 and scan with VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="target/release/safe-your-eyes.exe"
          else
            BIN="target/release/safe-your-eyes"
          fi
          SHA256=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$BIN")
          echo "### Release Binary Integrity (${RUNNER_OS})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Binary**: \`$BIN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256**: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VirusTotal Report**: https://www.virustotal.com/gui/file/$SHA256" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$VT_API_KEY" ]; then
            STATUS=$(curl --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --url https://www.virustotal.com/api/v3/files \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$BIN")
            # VirusTotal answers 409 when it already has this exact file, e.g. after a docs-only commit rebuilds the same binary.
            case "$STATUS" in
              200) echo "- **VirusTotal Upload**: Submitted to VirusTotal API v3" >> "$GITHUB_STEP_SUMMARY" ;;
              409) echo "- **VirusTotal Upload**: VirusTotal already has this file" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "::error::VirusTotal upload failed with HTTP $STATUS"; exit 1 ;;
            esac
          else
            echo "- **VirusTotal Upload**: Skipped (\`VT_API_KEY\` repository secret not configured)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Microsoft Store release binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bin safe-your-eyes --features msstore

      - name: Verify MSIX packaging (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & packaging/msix/package-msix.ps1 `
            -Version $version `
            -PackageName "SafeYourEyes.CIVerify" `
            -Publisher "CN=CI-Verify" `
            -PublisherDisplayName "Safe Your Eyes CI" `
            -X64Exe "target/release/safe-your-eyes.exe" `
            -OutputDir "dist-msix-ci" `
            -SkipBundle
