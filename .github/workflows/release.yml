name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ""
            bin_path: target/release/safe-your-eyes
            asset_name: safe-your-eyes-linux-x86_64
          - os: ubuntu-24.04-arm
            target: ""
            bin_path: target/release/safe-your-eyes
            asset_name: safe-your-eyes-linux-aarch64
          - os: macos-latest
            target: ""
            bin_path: target/release/safe-your-eyes
            asset_name: safe-your-eyes-macos-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_path: target/x86_64-apple-darwin/release/safe-your-eyes
            asset_name: safe-your-eyes-macos-x86_64.zip
          - os: windows-latest
            target: ""
            bin_path: target/release/safe-your-eyes.exe
            asset_name: safe-your-eyes-windows-x86_64.exe
          - os: windows-11-arm
            target: ""
            bin_path: target/release/safe-your-eyes.exe
            asset_name: safe-your-eyes-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GTK 4 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset_name }}

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}" --bin safe-your-eyes
          else
            cargo build --release --bin safe-your-eyes
          fi

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_DIR="dist/Safe Your Eyes.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "${{ matrix.bin_path }}" "$APP_DIR/Contents/MacOS/safe-your-eyes"
          chmod +x "$APP_DIR/Contents/MacOS/safe-your-eyes"
          cp assets/icons/app-icon.icns "$APP_DIR/Contents/Resources/app-icon.icns"
          VERSION="$VERSION" APP_DIR="$APP_DIR" python3 - <<'PY'
          import os, textwrap
          from pathlib import Path

          plist = textwrap.dedent(f'''\
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Safe Your Eyes</string>
              <key>CFBundleExecutable</key>
              <string>safe-your-eyes</string>
              <key>CFBundleIconFile</key>
              <string>app-icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.safeyoureyes.SafeYourEyes</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Safe Your Eyes</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>{os.environ["VERSION"]}</string>
              <key>CFBundleVersion</key>
              <string>{os.environ["VERSION"]}</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
            </dict>
            </plist>
          ''')
          Path(os.environ["APP_DIR"], "Contents", "Info.plist").write_text(plist, encoding="utf-8")
          PY
          codesign --force --deep --sign - "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/${{ matrix.asset_name }}"
          rm -rf "$APP_DIR"

      - name: Stage release binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset_name }}"

      - name: Sign Windows binary with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID || 'df8415de-63eb-40e3-9c26-ac30ed6b70d2' }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'safe-your-eyes' }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'Safe_your_eyes_Test_Signing' }}
        run: |
          Install-Module -Name SignPath -Scope CurrentUser -Force
          $unsigned = "dist/${{ matrix.asset_name }}"
          $signed = "dist/signed-${{ matrix.asset_name }}"
          Submit-SigningRequest `
            -OrganizationId $env:SIGNPATH_ORG_ID `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -ProjectSlug $env:SIGNPATH_PROJECT_SLUG `
            -SigningPolicySlug $env:SIGNPATH_POLICY_SLUG `
            -InputArtifactPath $unsigned `
            -OutputArtifactPath $signed `
            -WaitForCompletion
          Move-Item -Force $signed $unsigned
          $sig = Get-AuthenticodeSignature $unsigned
          Write-Host "Authenticode status: $($sig.Status) | Subject: $($sig.SignerCertificate.Subject)"

      - name: Calculate SHA-256 and scan with VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          ASSET="dist/${{ matrix.asset_name }}"
          SHA256=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$ASSET")
          echo "$SHA256  ${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"
          echo "### Release Binary (${{ matrix.asset_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256**: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VirusTotal Report**: https://www.virustotal.com/gui/file/$SHA256" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$VT_API_KEY" ]; then
            curl --silent --show-error --fail \
              --request POST \
              --url https://www.virustotal.com/api/v3/files \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$ASSET" > /dev/null
            echo "- **VirusTotal Upload**: Submitted to VirusTotal API v3" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Prepare checksums and release notes
        run: |
          cd release-assets
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f *.sha256
          {
            echo "## Safe Your Eyes Release"
            echo ""
            echo "### Install on macOS (Homebrew Cask)"
            echo ""
            echo '```bash'
            echo 'brew install --cask tunglt1810/tap/safe-your-eyes'
            echo '```'
            echo ""
            echo "### Downloads & VirusTotal Verification"
            echo ""
            echo "| Binary | SHA-256 | VirusTotal |"
            echo "|---|---|---|"
            while read -r hash file; do
              echo "| \`$file\` | \`$hash\` | [View Report](https://www.virustotal.com/gui/file/$hash) |"
            done < SHA256SUMS.txt
            echo ""
            echo "### Code Signing"
            echo ""
            echo "Windows binaries (x86_64 & ARM64) are signed via [SignPath.io](https://signpath.io/). See [Code Signing Policy](https://tunglt1810.github.io/safe-your-eyes/#code-signing-policy)."
          } > ../release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Safe Your Eyes $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Update Homebrew Cask formula
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARM_SHA=$(awk '$2 == "safe-your-eyes-macos-arm64.zip" {print $1}' release-assets/SHA256SUMS.txt)
          INTEL_SHA=$(awk '$2 == "safe-your-eyes-macos-x86_64.zip" {print $1}' release-assets/SHA256SUMS.txt)
          if [ -z "$ARM_SHA" ] || [ -z "$INTEL_SHA" ]; then
            echo "Missing macOS .zip SHA-256 checksums; skipping Cask update"
            exit 0
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          VERSION="$VERSION" ARM_SHA="$ARM_SHA" INTEL_SHA="$INTEL_SHA" python3 - <<'PY'
          import os, textwrap
          from pathlib import Path

          content = textwrap.dedent(f'''\
            cask "safe-your-eyes" do
              arch arm: "arm64", intel: "x86_64"

              version "{os.environ["VERSION"]}"
              sha256 arm:   "{os.environ["ARM_SHA"]}",
                     intel: "{os.environ["INTEL_SHA"]}"

              url "https://github.com/tunglt1810/safe-your-eyes/releases/download/v#{{version}}/safe-your-eyes-macos-#{{arch}}.zip"
              name "Safe Your Eyes"
              desc "Lightweight cross-platform Rust eye-protection desktop app"
              homepage "https://tunglt1810.github.io/safe-your-eyes/"

              app "Safe Your Eyes.app"
              binary "#{{appdir}}/Safe Your Eyes.app/Contents/MacOS/safe-your-eyes"

              postflight_steps do
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{{{appdir}}}}/Safe Your Eyes.app"]
              end

              zap trash: [
                "~/Library/Application Support/safe-your-eyes",
                "~/Library/Caches/safe-your-eyes",
                "~/Library/LaunchAgents/io.github.safeyoureyes.SafeYourEyes.plist",
              ]
            end
          ''')
          Path("Casks").mkdir(exist_ok=True)
          Path("Casks/safe-your-eyes.rb").write_text(content, encoding="utf-8")
          PY
          if ! git diff --quiet Casks/safe-your-eyes.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/safe-your-eyes.rb
            git commit -m "chore(cask): update safe-your-eyes to ${VERSION} [skip ci]"
            git push origin main
          fi
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tunglt1810/homebrew-tap.git" tap-repo
            mkdir -p tap-repo/Casks
            cp Casks/safe-your-eyes.rb tap-repo/Casks/safe-your-eyes.rb
            cd tap-repo
            if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Casks/safe-your-eyes.rb
              git commit -m "chore(cask): update safe-your-eyes to ${VERSION}"
              git push origin main
            fi
          fi
