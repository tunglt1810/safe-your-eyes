[package]
name = "sye-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform OS adapters for tray, idle, DND, notifications, audio, IPC, and autostart"

[dependencies]
directories = "6"
interprocess = { version = "2.4", default-features = false }
notify-rust = { version = "~4.17", default-features = false, features = ["z"] }
serde_json = { workspace = true }
sye-core = { workspace = true }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
x11rb = { version = "0.14", default-features = false, features = ["screensaver"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
png = "0.18"

[lints.rust]
# Linux and macOS enforce `#![forbid(unsafe_code)]` in `src/lib.rs`; Windows isolates Win32 FFI
# behind `#[expect(unsafe_code, reason = "Win32 FFI")]` with `// SAFETY:` comments.
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
