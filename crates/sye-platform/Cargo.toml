[package]
name = "sye-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform OS adapters for tray, idle, DND, notifications, audio, IPC, and autostart"

[dependencies]
directories = "6"
interprocess = { version = "2.4", default-features = false }
serde_json = { workspace = true }
sye-core = { workspace = true }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = { version = "~4.17", default-features = false, features = ["z"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
x11rb = { version = "0.14", default-features = false, features = ["screensaver"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSError",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSTimer",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
png = "0.18"

[lints.rust]
# Linux enforces `#![forbid(unsafe_code)]` in `src/lib.rs`; Windows and macOS isolate OS FFI
# behind `#[expect(unsafe_code, reason = "...")]` with `// SAFETY:` comments.
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"

or_fun_call = "warn"
redundant_clone = "warn"
redundant_else = "warn"
significant_drop_tightening = "warn"
use_self = "warn"

dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
