[package]
name = "sye-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "On-demand Native Shell (nsh) Cozy UI for multi-monitor break overlay and settings"

[features]
msstore = []

[dependencies]
sye-core = { workspace = true }
nsh-core = "0.7.1"
nsh-base = { version = "0.7.1", default-features = false }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-core = { version = "0.7.1", features = ["shader"] }
nsh-platform-linux = { version = "0.7.1", default-features = false, features = ["shader"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-core = { version = "0.7.1", features = ["shader"] }
nsh-platform-windows = { version = "0.7.1", default-features = false, features = ["shader"] }

[dev-dependencies]
nsh-engine = { version = "0.7.1", default-features = false }
nsh-testing = "0.7.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
nsh-engine = { version = "0.7.1", default-features = false, features = ["shader"] }

[build-dependencies]
png = "0.18"

[lints]
workspace = true
